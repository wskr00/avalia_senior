<p-card [header]="title" class="shadow-sm mb-4 border surface-border">
  <div [formGroup]="evaluationService.form">
    <div class="flex flex-col gap-3" formArrayName="responses">
      @for (option of optionsContent; track $index) {
      <div class="flex align-items-center gap-2 mb-2">
        <p-radioButton
          [name]="'question-' + controlIndex"
          [value]="option.value"
          [formControlName]="controlIndex"
          [inputId]="'q' + controlIndex + 'opt' + $index"
        >
        </p-radioButton>
        <label [for]="'q' + controlIndex + 'opt' + $index" class="cursor-pointer text-700">
          {{ option.label }}
        </label>
      </div>
      }
    </div>
  </div>
</p-card>
