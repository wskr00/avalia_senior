<div [formGroup]="evaluationService.form">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4" formGroupName="basicInfo">
    <div class="flex flex-col gap-2">
      <label for="doctorName" class="font-medium text-900">Nome do Médico</label>
      <p-iconField iconPosition="left">
        <p-inputIcon class="pi pi-user-edit" />
        <input
          pInputText
          id="doctorName"
          formControlName="doctorName"
          placeholder="Dr(a). Exemplo"
          [fluid]="true"
        />
      </p-iconField>
    </div>

    <div class="flex flex-col gap-2">
      <label for="patientName" class="font-medium text-900">Nome do Paciente</label>
      <p-iconField iconPosition="left">
        <p-inputIcon class="pi pi-user" />
        <input
          pInputText
          id="patientName"
          formControlName="patientName"
          placeholder="Nome Completo"
          [fluid]="true"
        />
      </p-iconField>
    </div>

    <div class="flex flex-col gap-2">
      <label for="age" class="font-medium text-900">Idade</label>
      <p-inputNumber
        id="age"
        formControlName="age"
        placeholder="Ex: 70"
        [min]="0"
        [max]="150"
        [fluid]="true"
      >
      </p-inputNumber>
    </div>

    <div class="flex flex-col gap-2">
      <label for="date" class="font-medium text-900">Data da Avaliação</label>
      <p-datepicker
        id="date"
        formControlName="date"
        dateFormat="dd/mm/yy"
        [showIcon]="true"
        placeholder="00/00/0000"
        [fluid]="true"
      >
      </p-datepicker>
    </div>
  </div>
</div>
