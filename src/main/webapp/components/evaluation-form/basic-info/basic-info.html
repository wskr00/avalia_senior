<div [formGroup]="evaluationFormService.form">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-y-6" formGroupName="basicInfo">
    <p-floatLabel variant="on" class="text-sm md:text-base">
      <input
        pInputText
        id="doctorName"
        formControlName="doctorName"
        [fluid]="true"
        aria-required="true"
      />
      <label for="doctorName">Nome do Médico</label>
    </p-floatLabel>

    <p-floatLabel variant="on" class="text-sm md:text-base">
      <input
        pInputText
        id="patientName"
        formControlName="patientName"
        [fluid]="true"
        aria-required="true"
      />
      <label for="patientName">Nome do Paciente</label>
    </p-floatLabel>

    <p-floatLabel variant="on" class="text-sm md:text-base">
      <p-inputNumber
        inputId="age"
        formControlName="age"
        [min]="0"
        [max]="150"
        [fluid]="true"
        [ariaRequired]="true"
        ariaLabel="Idade do Paciente"
      ></p-inputNumber>
      <label for="age">Idade do Paciente</label>
    </p-floatLabel>

    <p-floatLabel variant="on" class="text-sm md:text-base">
      <p-datepicker
        inputId="date"
        formControlName="date"
        dateFormat="dd/mm/yy"
        [showIcon]="true"
        [fluid]="true"
        [required]="true"
        [ariaRequired]="true"
        ariaLabelledBy="label-date"
      ></p-datepicker>
      <label for="date" id="label-date">Data da Avaliação</label>
    </p-floatLabel>
  </div>
</div>
