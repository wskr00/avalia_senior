<p-dialog
  [(visible)]="visible"
  (onHide)="close()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  [showHeader]="true"
  aria-labelledby="modal-result-title"
  class="w-[95%] md:w-full max-w-md border-round-xl"
>
  <ng-template pTemplate="header">
    <div class="grow">
      <span id="modal-result-title" class="sr-only">Resultado da Avaliação</span>
    </div>
  </ng-template>

  <div class="flex flex-col items-center p-2 md:p-4 text-center">
    <section class="mb-8 w-full" aria-labelledby="score-heading">
      <h2
        id="score-heading"
        class="text-xs md:text-sm uppercase tracking-widest font-bold mb-3 text-muted-color"
      >
        Pontuação Total
      </h2>
      <div class="flex items-center justify-center">
        <span
          class="text-5xl md:text-6xl font-black bg-primary/5 w-24 h-24 flex items-center justify-center rounded-full shadow-sm"
        >
          {{ result()?.score }}
        </span>
      </div>
    </section>

    <section class="mb-8 p-4 bg-emphasis rounded-2xl w-full" aria-labelledby="result-heading">
      <h2
        id="result-heading"
        class="text-xs md:text-sm uppercase tracking-widest font-bold mb-2 text-muted-color"
      >
        Classificação
      </h2>
      <p class="text-xl md:text-2xl font-bold text-color leading-tight">
        {{ result()?.interpretation }}
      </p>
    </section>

    <footer class="w-full">
      <p-button
        label="Baixar PDF"
        icon="pi pi-file-pdf"
        [fluid]="true"
        size="large"
        (onClick)="downloadPdf()"
        class="py-4 shadow-md result"
        ariaLabel="Baixar resultado em PDF"
      ></p-button>
    </footer>
  </div>
</p-dialog>
