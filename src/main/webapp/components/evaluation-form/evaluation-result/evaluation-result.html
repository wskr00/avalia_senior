<p-dialog
  [(visible)]="visible"
  (onHide)="close()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  styleClass="w-[95%] md:w-full max-w-md border-round-xl"
>
  <div class="flex flex-col items-center p-4 md:p-6 text-center">
    <div class="mb-6 md:mb-8">
      <span class="block text-xs md:text-sm uppercase tracking-wider font-semibold mb-2"
        >Pontuação</span
      >
      <span class="text-3xl md:text-4xl lg:text-5xl font-extrabold">{{ result()?.score }}</span>
    </div>

    <div class="mb-6 md:mb-8">
      <span class="block text-xs md:text-sm uppercase tracking-wider font-semibold mb-2"
        >Resultado</span
      >
      <span class="text-lg md:text-xl lg:text-2xl font-medium">{{ result()?.interpretation }}</span>
    </div>

    <div class="flex flex-col gap-3 w-full">
      <p-button
        label="Baixar PDF"
        icon="pi pi-file-pdf"
        [fluid]="true"
        size="large"
        (onClick)="downloadPdf()"
        class="text-sm md:text-base result"
      ></p-button>
    </div>
  </div>
</p-dialog>
