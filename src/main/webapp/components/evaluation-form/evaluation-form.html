<form
  [formGroup]="evaluationFormService.form"
  (ngSubmit)="onSubmit()"
  class="flex flex-col gap-6 px-4 pt-2 pb-4 md:px-6 md:pt-3 md:pb-6 max-w-4xl mx-auto w-full min-h-screen"
>
  <p-card class="shadow-sm border border-surface rounded-2xl overflow-hidden">
    <app-basic-info></app-basic-info>
  </p-card>

  @if (evaluationFormService.responses.length === questions().length) {
  <div formArrayName="responses" class="flex flex-col gap-6">
    @for (question of questions(); track $index; let qIndex = $index) {
    <p-card
      class="shadow-sm border border-surface transition-shadow duration-300 hover:shadow-md rounded-2xl"
    >
      <ng-template pTemplate="header">
        <div class="px-4 md:px-6 pt-4 md:pt-5">
          <h3 class="text-base md:text-lg lg:text-xl font-semibold leading-relaxed text-color">
            {{ question.title }}
          </h3>
          <div class="h-px w-full bg-surface-200 dark:bg-surface-700 mt-3"></div>
        </div>
      </ng-template>

      <div class="flex flex-col gap-1">
        @for (option of question.options; track $index; let oIndex = $index) {
        <div
          class="flex items-center gap-3 p-3 rounded-xl transition-all duration-200 cursor-pointer group hover:bg-emphasis"
          (click)="radioButton.select($event)"
        >
          <p-radioButton
            #radioButton
            [name]="'group-' + qIndex"
            [value]="option.value"
            [formControlName]="qIndex"
            [inputId]="'q' + qIndex + 'opt' + oIndex"
            class="scale-110"
          ></p-radioButton>

          <label
            [for]="'q' + qIndex + 'opt' + oIndex"
            class="cursor-pointer text-sm md:text-base font-medium text-color w-full select-none"
          >
            {{ option.label }}
          </label>
        </div>
        }
      </div>
    </p-card>
    }
  </div>
  } @else {
  <div class="flex flex-col items-center justify-center p-12 md:p-20 gap-4">
    <i class="pi pi-spin pi-spinner text-primary text-3xl md:text-4xl"></i>
    <p class="text-sm md:text-base font-medium text-muted-color animate-pulse">
      Carregando avaliação...
    </p>
  </div>
  }

  <app-submit-button (onClick)="onSubmit()"></app-submit-button>
</form>

<app-evaluation-result
  [(visible)]="showResult"
  [result]="calculationResult()"
  [title]="evaluationTitle()"
  [formValues]="evaluationFormService.form.value.basicInfo"
  [config]="config()"
></app-evaluation-result>
