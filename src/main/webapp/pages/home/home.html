<div class="flex flex-col gap-6 px-4 pt-2 pb-4 md:px-6 md:pt-3 md:pb-6 max-w-4xl mx-auto w-full">
  <p-card class="shadow-sm border border-surface rounded-2xl overflow-hidden">
    <ng-template pTemplate="header">
      <div class="px-4 md:px-6 pt-4 md:pt-5 pb-3">
        <h2 class="text-xl md:text-2xl font-semibold leading-relaxed text-center">
          Escalas de Avaliação
        </h2>
        <div class="h-px w-full bg-surface-200 dark:bg-surface-700 mt-3" aria-hidden="true"></div>
      </div>
    </ng-template>

    <nav aria-label="Menu de escalas disponíveis">
      <ul class="flex flex-col gap-4 list-none p-0 m-0">
        <li class="w-full">
          <p-button
            label="Escala de Lawton"
            severity="secondary"
            [fluid]="true"
            routerLink="/lawton"
            size="large"
            class="text-sm md:text-base text-left justify-start"
            ariaLabel="Acessar Escala de Lawton"
          ></p-button>
        </li>

        <li class="w-full">
          <p-button
            label="Índice de Katz"
            severity="secondary"
            [fluid]="true"
            size="large"
            class="text-sm md:text-base text-left justify-start"
            ariaLabel="Acessar Índice de Katz"
            routerLink="/katz"
          ></p-button>
        </li>

        <li class="w-full">
          <p-button
            label="3"
            severity="secondary"
            [fluid]="true"
            size="large"
            class="text-sm md:text-base text-left justify-start"
            ariaLabel="Acessar Outra Avaliação"
          ></p-button>
        </li>
      </ul>
    </nav>
  </p-card>
</div>
