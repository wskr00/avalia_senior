<div
  class="flex flex-col gap-6 px-4 pt-2 pb-4 md:px-6 md:pt-3 md:pb-6 max-w-4xl mx-auto w-full min-h-screen"
>
  <p-card class="shadow-sm border border-surface rounded-2xl overflow-hidden">
    <ng-template pTemplate="header">
      <div class="px-4 md:px-6 pt-4 md:pt-5 pb-3">
        <h2 class="text-xl md:text-xl2 lg:text-xl4 font-semibold leading-relaxed text-center">
          Escalas
        </h2>
        <div class="h-px w-full bg-surface-200 dark:bg-surface-700 mt-3"></div>
      </div>
    </ng-template>

    <div class="flex flex-col gap-6">
      <p-button
        label="Escala de Lawton"
        severity="secondary"
        [fluid]="true"
        routerLink="/lawton"
        size="large"
        class="text-sm md:text-base"
      ></p-button>

      <p-button
        label="2"
        severity="secondary"
        [fluid]="true"
        size="large"
        class="text-sm md:text-base"
      ></p-button>

      <p-button
        label="3"
        severity="secondary"
        [fluid]="true"
        size="large"
        class="text-sm md:text-base"
      ></p-button>
    </div>
  </p-card>
</div>
