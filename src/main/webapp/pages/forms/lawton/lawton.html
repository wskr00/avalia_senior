<app-evaluation-container (finish)="handleFinish($event)">
  <app-evaluation-section title="Capacidade de usar o telefone">
    <p-option label="Usa por iniciativa própria" [value]="3"></p-option>
    <p-option label="Atende apenas" [value]="2"></p-option>
    <p-option label="Não usa" [value]="1"></p-option>
  </app-evaluation-section>

  <app-evaluation-section title="Fazer compras">
    <p-option label="Faz tudo sozinho" [value]="3"></p-option>
    <p-option label="Necessita de ajuda" [value]="2"></p-option>
    <p-option label="Incapaz" [value]="1"></p-option>
  </app-evaluation-section>
</app-evaluation-container>
